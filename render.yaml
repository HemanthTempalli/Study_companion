services:
  # 1. FastAPI Backend API
  - type: web
    name: ai-study-companion-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: ./uploads

  # 2. Background PDF & RAG Worker
  - type: worker
    name: ai-study-companion-worker
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m app.workers.runner
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WORKER_POLL_INTERVAL
        value: "5"

  # 3. Next.js Frontend
  - type: web
    name: ai-study-companion-frontend
    env: node
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
